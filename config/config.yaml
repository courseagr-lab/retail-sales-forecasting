data:
  raw_path: "data/raw/daily_sales_raw.csv"
  interim_path: "data/interim/sales_cleaned.csv"
  processed_path: "data/processed/sales_features.csv"
  target: "sales"
  date_col: "date"

cleaning:
  outlier_rolling_window: 30
  outlier_std_threshold: 3

split:
  test_days: 90

model:
  random_state: 42

mlflow:
  experiment_name: "retail-sales-forecasting"
  tracking_uri: "sqlite:///mlflow.db"

output:
  model_path: "models/"
  metrics_path: "reports/metrics.json"
  figures_path: "reports/figures/"
